spring.application.name=Bai3Session11
spring.datasource.url=jdbc:postgresql://localhost:5433/luutrulog
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
logging.file.name=logs/patient_web_service.log
logging.logback.rollingpolicy.max-file-size=2MB

# 3. Ten file sau khi xoay vong va nen gzip
logging.logback.rollingpolicy.file-name-pattern=logs/patient_web_service.%d{yyyy-MM-dd}.%i.log.gz

# 4. Luu lich su toi da 7 ngay
logging.logback.rollingpolicy.max-history=7

# 5. Xoa file Log cu theo lich su khi khoi dong
logging.logback.rollingpolicy.clean-history-on-start=true

# Toan bo ung dung o muc INFO
logging.level.root=INFO

# Hibernate hien thi cau lenh SQL
logging.level.org.hibernate.SQL=DEBUG

# Service hien thi log chi tiet
logging.level.com.medical.Service=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Dinh dang File giong Console
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


spring.jpa.show-sql=false
