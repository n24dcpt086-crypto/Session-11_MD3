spring.application.name=Bai2Session11
spring.datasource.url=jdbc:postgresql://localhost:5433/quanlilog
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.file.name=loggings/logging.log
logging.file.path=loggings
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.level=%5p
# thông số giới hạn dung lượng của 1 file
logging.logback.rollingpolicy.max-file-size=50MB
# giới hạn file tồn tại trong bao lâu
logging.logback.rollingpolicy.max-history=30
